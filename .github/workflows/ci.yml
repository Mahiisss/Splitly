name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run test typecheck lint build

      # End-to-end: a real browser clicks through the built web app at desktop and phone sizes.
      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e --workspace=@splitly/web
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
